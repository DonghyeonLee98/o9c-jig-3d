<style>
  html, body { margin: 0; height: 100%; background: #eef0f2; font-family: Arial, "Malgun Gothic", sans-serif; color: #222; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #top b { font-size: 14px; } #top a { color: #0b57d0; }
  .panel { position: fixed; background: rgba(255,255,255,.95); border: 1px solid #bbb; border-radius: 6px; z-index: 4; box-sizing: border-box; font-size: 12.5px; }

  .panel .body { padding: 7px 9px; }
  .panel.min .body { display: none; } .panel.min h4 { border-radius: 6px; }
  #ctl { left: 6px; top: 44px; width: 268px; max-height: calc(100vh - 56px); overflow: auto; }
  #tabw { left: 280px; right: 6px; bottom: 6px; max-height: 44vh; overflow: auto; }
  button { font: 12px Arial, "Malgun Gothic"; padding: 4px 7px; margin: 1px; border: 1px solid #888; background: #fff; border-radius: 3px; cursor: pointer; }
  button.on { background: #222; color: #fff; border-color: #222; }
  .sec { margin: 5px 0 2px; font-weight: bold; color: #444; }
  #light { width: 100%; }
  table.t { border-collapse: collapse; width: 100%; font-size: 11.5px; } table.t th, table.t td { border: 1px solid #ddd; padding: 2px 4px; text-align: center; white-space: nowrap; }
  table.t th { background: #f1f3f4; } tr.handover td { background: #fff4cc; } tr.short td { background: #ffe3e0; } tr.blocked td { background: #fdd; } tr.open td { background: #f4f4f4; }
  .on { } td b.on { color: #b00020; } small { color: #666; }
  .g { margin: 2px 0 5px; line-height: 1.5; } .n { margin: 2px 0; font-size: 12px; color: #333; } .n.bad { color: #b00020; }
  #stat { font-weight: bold; margin-bottom: 3px; }
  #fault { margin-top: 5px; padding: 5px 7px; background: #fdecea; border: 1px solid #e57373; border-radius: 4px; line-height: 1.5; }
  .hide { display: none !important; }
  #pick { position: fixed; left: 50%; transform: translateX(-50%); top: 48px; background: #222; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 12.5px; display: none; z-index: 6; max-width: 92vw; line-height: 1.45; }

  #foot { margin-top: 3px; color: #777; font-size: 11.5px; }
  @media (max-width: 600px) {
    #ctl { top: auto; bottom: 46px; left: 6px; right: 6px; width: auto; max-height: 48vh; } #tabw { left: 6px; right: 6px; bottom: 6px; max-height: 40vh; }

<body>
<canvas id="c"></canvas>
<div id="top"><b>유지판 + 지그 연결 (3D)</b><a href="index.html?m=HOLD4">유지판 모델</a><a href="index.html">지그 뷰어</a>
  <span id="views"><button data-v="all">전체</button><button data-v="board">유지판</button><button data-v="jig">지그</button><button data-v="kei">키슬리</button><button data-v="pc">PC·허브</button><button data-v="t4">4셀 경로</button></span></div>

</div></div>
